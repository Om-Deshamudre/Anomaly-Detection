<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Analysis Results</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            text-align: center;
        }
        h1 {
            color: #333;
        }
        .container {
            margin-top: 20px;
        }
        img {
            max-width: 100%;
            height: auto;
            border: 1px solid #ddd;
            border-radius: 4px;
            padding: 5px;
            margin-bottom: 20px;
        }
        a {
            display: inline-block;
            padding: 10px 20px;
            margin-top: 10px;
            background-color: #007bff;
            color: white;
            text-decoration: none;
            border-radius: 5px;
        }
        a:hover {
            background-color: #0056b3;
        }
        .message {
            margin-bottom: 20px;
            padding: 10px;
            border-radius: 5px;
            background-color: #e7f3fe;
            border-left: 6px solid #2196F3;
            color: #333;
        }
    </style>
</head>
<body>
    <h1>Transaction Analysis Results</h1>

    {% if message %}
        <div class="message">
            <p>{{ message }}</p>
        </div>
    {% endif %}

    <div class="container">
        <h2>Network Analysis Plot</h2>
        <img src="{{ url_for('static', filename='network_analysis_plot.png') }}" alt="Network Analysis Plot">
    </div>

    <a href="{{ url_for('view_database') }}">View Classified Transaction Data</a>
    <br>
    <a href="{{ url_for('upload_file') }}">Upload Another File</a>
</body>
</html>
